[package]
name = "zenvision"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
futures-lite = "2"
libc = "0.2"
nusb = "0.2.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
socket2 = { version = "0.5", features = ["all"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
